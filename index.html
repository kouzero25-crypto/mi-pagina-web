<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accede a tu cuenta</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            background: #1f2021;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #e8eaed;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }


        /* =================================
           PAGINA
        ================================= */

        .pagina {
            width: 100%;
            max-width: 920px;
        }


        /* =================================
           TARJETA
        ================================= */

        .tarjeta {
            width: 100%;
            min-height: 420px;

            background: #0f0f0f;

            border-radius: 28px;

            padding: 40px 36px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            column-gap: 70px;
        }


        /* =================================
           COLUMNA IZQUIERDA
        ================================= */

        .izquierda {
            display: flex;

            flex-direction: column;

            align-items: flex-start;
        }


        /* =================================
           LOGO TEMPORAL
        ================================= */

        .logo {
            width: 52px;
            height: 52px;

            margin-bottom: 30px;

            border-radius: 50%;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 25px;

            font-weight: bold;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #4285f4 0%,
                    #34a853 35%,
                    #fbbc05 65%,
                    #ea4335 100%
                );
        }


        /* =================================
           TITULOS
        ================================= */

        h1 {
            margin: 0;

            font-size: 36px;

            line-height: 1.2;

            font-weight: 400;

            letter-spacing: -0.5px;

            color: #e8eaed;
        }


        .descripcion {
            margin-top: 18px;

            font-size: 16px;

            line-height: 1.5;

            color: #bdc1c6;
        }


        /* =================================
           COLUMNA DERECHA
        ================================= */

        .derecha {
            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        /* =================================
           PASOS
        ================================= */

        .paso {
            width: 100%;
        }


        .oculto {
            display: none;
        }


        /* =================================
           CAMPOS
        ================================= */

        .campo {
            position: relative;

            margin-bottom: 24px;
        }


        input {
            width: 100%;

            height: 56px;

            padding: 15px;

            border-radius: 5px;

            border: 1px solid #8a8d91;

            background: transparent;

            color: #e8eaed;

            font-size: 16px;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }


        input:hover {
            border-color: #bdc1c6;
        }


        input:focus {
            border: 2px solid #8ab4f8;

            padding: 14px;
        }


        input::placeholder {
            color: transparent;
        }


        /* =================================
           LABEL FLOTANTE
        ================================= */

        .campo label {
            position: absolute;

            left: 13px;

            top: 18px;

            padding: 0 5px;

            background: #0f0f0f;

            color: #9aa0a6;

            font-size: 16px;

            pointer-events: none;

            transition:
                top 0.15s,
                font-size 0.15s,
                color 0.15s;
        }


        input:focus + label,
        input:not(:placeholder-shown) + label {
            top: -8px;

            font-size: 12px;

            color: #8ab4f8;
        }


        /* =================================
           CUENTA SELECCIONADA
        ================================= */

        .cuenta {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 7px 12px;

            margin-bottom: 25px;

            border: 1px solid #777;

            border-radius: 20px;

            color: #e8eaed;

            font-size: 14px;

            max-width: 100%;
        }


        .icono-cuenta {
            width: 22px;
            height: 22px;

            border-radius: 50%;

            border: 1px solid #aaa;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 12px;
        }


        #correoMostrado {
            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        /* =================================
           MOSTRAR CONTRASEÑA
        ================================= */

        .mostrar {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: -8px;

            color: #e8eaed;

            font-size: 14px;

            cursor: pointer;
        }


        .mostrar input {
            width: 18px;
            height: 18px;

            accent-color: #8ab4f8;

            cursor: pointer;
        }


        /* =================================
           ENLACES
        ================================= */

        .enlace {
            display: inline-block;

            margin-top: 22px;

            color: #8ab4f8;

            text-decoration: none;

            font-size: 14px;

            font-weight: 500;
        }


        .enlace:hover {
            text-decoration: underline;
        }


        /* =================================
           ACCIONES
        ================================= */

        .acciones {
            margin-top: 48px;

            display: flex;

            align-items: center;

            justify-content: flex-end;

            gap: 28px;
        }


        .crear {
            color: #8ab4f8;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;
        }


        .crear:hover {
            text-decoration: underline;
        }


        /* =================================
           BOTON
        ================================= */

        button {
            border: none;

            border-radius: 24px;

            padding: 13px 25px;

            min-width: 108px;

            background: #a8c7fa;

            color: #202124;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.1s;
        }


        button:hover {
            background: #c1d6fa;
        }


        button:active {
            transform: scale(0.97);
        }


        button:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }


        /* =================================
           MENSAJE
        ================================= */

        #mensaje {
            margin-top: 22px;

            min-height: 20px;

            font-size: 14px;

            color: #bdc1c6;
        }


        /* =================================
           PIE
        ================================= */

        .pie {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 20px 16px 0;

            color: #bdc1c6;

            font-size: 12px;
        }


        .pie-derecha {
            display: flex;

            gap: 28px;
        }


        .pie a {
            color: #bdc1c6;

            text-decoration: none;
        }


        .pie a:hover {
            text-decoration: underline;
        }


        /* =================================
           CELULAR
        ================================= */

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }


            .tarjeta {
                min-height: auto;

                display: block;

                padding: 32px 25px;

                border-radius: 22px;
            }


            .izquierda {
                margin-bottom: 38px;
            }


            .logo {
                margin-bottom: 25px;
            }


            h1 {
                font-size: 30px;
            }


            .descripcion {
                margin-top: 14px;
            }


            .derecha {
                display: block;
            }


            .acciones {
                margin-top: 35px;

                justify-content: space-between;
            }


            .pie {
                padding-left: 8px;

                padding-right: 8px;

                flex-direction: column;

                align-items: flex-start;

                gap: 18px;
            }


            .pie-derecha {
                gap: 20px;
            }

        }


        /* =================================
           CELULAR PEQUEÑO
        ================================= */

        @media (max-width: 400px) {

            h1 {
                font-size: 27px;
            }


            .tarjeta {
                padding: 28px 20px;
            }


            .acciones {
                gap: 15px;
            }

        }

    </style>
</head>


<body>


    <div class="pagina">


        <!-- =================================
             TARJETA PRINCIPAL
        ================================= -->

        <div class="tarjeta">


            <!-- =================================
                 IZQUIERDA
            ================================= -->

            <div class="izquierda">


                <!-- LOGO TEMPORAL -->

                <div class="logo">
                    A
                </div>


                <!-- TITULO -->

                <h1 id="titulo">
                    Accede a tu cuenta
                </h1>


                <!-- DESCRIPCION -->

                <div
                    class="descripcion"
                    id="descripcion"
                >
                    Usa tu correo electrónico para continuar.
                </div>


            </div>



            <!-- =================================
                 DERECHA
            ================================= -->

            <div class="derecha">


                <!-- =================================
                     PASO 1
                ================================= -->

                <div
                    id="paso1"
                    class="paso"
                >

                    <form id="formularioCorreo">

                        <div class="campo">

                            <input
                                type="email"
                                id="correo"
                                placeholder=" "
                                autocomplete="username"
                                required
                            >

                            <label for="correo">
                                Correo electrónico
                            </label>

                        </div>


                        <div class="acciones">

                            <a
                                href="#"
                                class="crear"
                                id="crearCuenta1"
                            >
                                Crear cuenta
                            </a>


                            <button
                                type="submit"
                                id="botonCorreo"
                            >
                                Siguiente
                            </button>

                        </div>

                    </form>

                </div>



                <!-- =================================
                     PASO 2
                ================================= -->

                <div
                    id="paso2"
                    class="paso oculto"
                >


                    <!-- CUENTA -->

                    <div class="cuenta">

                        <div class="icono-cuenta">
                            👤
                        </div>

                        <span id="correoMostrado"></span>

                        <span>
                            ▾
                        </span>

                    </div>


                    <!-- CONTRASEÑA -->

                    <form id="formularioContrasena">


                        <div class="campo">

                            <input
                                type="password"
                                id="contrasena"
                                placeholder=" "
                                autocomplete="current-password"
                                required
                            >

                            <label for="contrasena">
                                Contraseña
                            </label>

                        </div>


                        <!-- MOSTRAR CONTRASEÑA -->

                        <label class="mostrar">

                            <input
                                type="checkbox"
                                id="mostrarContrasena"
                            >

                            <span>
                                Mostrar contraseña
                            </span>

                        </label>


                        <!-- RECUPERAR -->

                        <a
                            href="#"
                            class="enlace"
                            id="recuperar"
                        >
                            ¿Olvidaste la contraseña?
                        </a>


                        <!-- ACCIONES -->

                        <div class="acciones">

                            <a
                                href="#"
                                class="crear"
                                id="volver"
                            >
                                Atrás
                            </a>


                            <button
                                type="submit"
                                id="botonContrasena"
                            >
                                Siguiente
                            </button>

                        </div>


                    </form>

                </div>


                <!-- MENSAJE -->

                <div id="mensaje"></div>


            </div>

        </div>



        <!-- =================================
             PIE
        ================================= -->

        <div class="pie">


            <div>
                Español (Latinoamérica)
            </div>


            <div class="pie-derecha">

                <a href="#">
                    Ayuda
                </a>

                <a href="#">
                    Privacidad
                </a>

                <a href="#">
                    Condiciones
                </a>

            </div>


        </div>


    </div>



    <script>

        /* =================================
           ELEMENTOS
        ================================= */

        const paso1 =
            document.getElementById("paso1");

        const paso2 =
            document.getElementById("paso2");

        const correo =
            document.getElementById("correo");

        const correoMostrado =
            document.getElementById("correoMostrado");

        const contrasena =
            document.getElementById("contrasena");

        const mensaje =
            document.getElementById("mensaje");

        const titulo =
            document.getElementById("titulo");

        const descripcion =
            document.getElementById("descripcion");

        const botonCorreo =
            document.getElementById("botonCorreo");

        const botonContrasena =
            document.getElementById("botonContrasena");



        /* =================================
           PASO 1 → PASO 2
        ================================= */

        document
        .getElementById("formularioCorreo")
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const correoIngresado =
                    correo.value.trim();


                if (!correoIngresado) {

                    mensaje.textContent =
                        "Ingresa tu correo electrónico.";

                    return;
                }


                /* Mostrar correo en segunda pantalla */

                correoMostrado.textContent =
                    correoIngresado;


                /* Cambiar contenido izquierdo */

                titulo.textContent =
                    "Te damos la bienvenida";


                descripcion.textContent =
                    "Ingresa tu contraseña para continuar.";


                /* Ocultar paso 1 */

                paso1.classList.add("oculto");


                /* Mostrar paso 2 */

                paso2.classList.remove("oculto");


                /* Limpiar mensaje */

                mensaje.textContent = "";


                /* Enfocar contraseña */

                setTimeout(function() {

                    contrasena.focus();

                }, 100);

            }
        );



        /* =================================
           MOSTRAR / OCULTAR CONTRASEÑA
        ================================= */

        document
        .getElementById("mostrarContrasena")
        .addEventListener(
            "change",
            function() {

                if (this.checked) {

                    contrasena.type =
                        "text";

                } else {

                    contrasena.type =
                        "password";

                }

            }
        );



        /* =================================
           VOLVER AL CORREO
        ================================= */

        document
        .getElementById("volver")
        .addEventListener(
            "click",
            function(event) {

                event.preventDefault();


                paso2.classList.add("oculto");

                paso1.classList.remove("oculto");


                titulo.textContent =
                    "Accede a tu cuenta";


                descripcion.textContent =
                    "Usa tu correo electrónico para continuar.";


                mensaje.textContent = "";


                contrasena.value = "";


                correo.focus();

            }
        );



        /* =================================
           SEGUNDO PASO
        ================================= */

        document
        .getElementById("formularioContrasena")
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                if (!contrasena.value) {

                    mensaje.textContent =
                        "Ingresa tu contraseña.";

                    return;
                }


                /*
                    AQUÍ NO SE ENVÍA LA CONTRASEÑA
                    A GOOGLE SHEETS.

                    La autenticación real deberá
                    conectarse posteriormente a un
                    servicio seguro de autenticación.
                */


                botonContrasena.disabled =
                    true;


                botonContrasena.textContent =
                    "Comprobando...";


                setTimeout(function() {

                    mensaje.textContent =
                        "El sistema de autenticación está pendiente de configurar.";

                    botonContrasena.disabled =
                        false;

                    botonContrasena.textContent =
                        "Siguiente";

                }, 800);

            }
        );



        /* =================================
           RECUPERAR CONTRASEÑA
        ================================= */

        document
        .getElementById("recuperar")
        .addEventListener(
            "click",
            function(event) {

                event.preventDefault();


                mensaje.textContent =
                    "La recuperación de contraseña se configurará posteriormente.";

            }
        );



        /* =================================
           CREAR CUENTA
        ================================= */

        document
        .getElementById("crearCuenta1")
        .addEventListener(
            "click",
            function(event) {

                event.preventDefault();


                mensaje.textContent =
                    "El registro de cuentas se configurará posteriormente.";

            }
        );

    </script>

</body>
</html>
