<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accede a tu cuenta</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background: #1f2021;
            font-family: Arial, Helvetica, sans-serif;
            color: #e8eaed;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        .pagina {
            width: 100%;
            max-width: 920px;
        }

        .tarjeta {
            width: 100%;
            min-height: 420px;

            background: #0f0f0f;
            border-radius: 28px;
            padding: 40px 36px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 70px;
        }

        .izquierda {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .logo {
            width: 52px;
            height: 52px;
            margin-bottom: 30px;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 25px;
            font-weight: bold;
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #4285f4 0%,
                    #34a853 35%,
                    #fbbc05 65%,
                    #ea4335 100%
                );
        }

        h1 {
            margin: 0;
            font-size: 36px;
            line-height: 1.2;
            font-weight: 400;
            letter-spacing: -0.5px;
            color: #e8eaed;
        }

        .descripcion {
            margin-top: 18px;
            font-size: 16px;
            line-height: 1.5;
            color: #bdc1c6;
        }

        .derecha {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .paso {
            width: 100%;
        }

        .oculto {
            display: none;
        }

        .campo {
            position: relative;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 56px;

            padding: 15px;

            border-radius: 5px;
            border: 1px solid #8a8d91;

            background: transparent;
            color: #e8eaed;

            font-size: 16px;
            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        input:hover {
            border-color: #bdc1c6;
        }

        input:focus {
            border: 2px solid #8ab4f8;
            padding: 14px;
        }

        input::placeholder {
            color: transparent;
        }

        .campo label {
            position: absolute;

            left: 13px;
            top: 18px;

            padding: 0 5px;

            background: #0f0f0f;
            color: #9aa0a6;

            font-size: 16px;
            pointer-events: none;

            transition:
                top 0.15s,
                font-size 0.15s,
                color 0.15s;
        }

        input:focus + label,
        input:not(:placeholder-shown) + label {
            top: -8px;
            font-size: 12px;
            color: #8ab4f8;
        }

        /* =================================
           ERROR DEL CORREO
        ================================= */

        .error-correo {
            display: none;

            margin-top: 8px;
            margin-left: 2px;

            color: #f28b82;
            font-size: 14px;
            line-height: 1.4;
        }

        .error-correo.visible {
            display: block;
        }

        .campo.error input {
            border-color: #f28b82;
        }

        .campo.error input:focus {
            border: 2px solid #f28b82;
        }

        .campo.error label {
            color: #f28b82;
        }

        /* =================================
           CUENTA
        ================================= */

        .cuenta {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 7px 12px;
            margin-bottom: 25px;

            border: 1px solid #777;
            border-radius: 20px;

            color: #e8eaed;
            font-size: 14px;

            max-width: 100%;
        }

        .icono-cuenta {
            width: 22px;
            height: 22px;

            border-radius: 50%;
            border: 1px solid #aaa;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 12px;
        }

        #correoMostrado {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* =================================
           CORREO DE BIENVENIDA
        ================================= */

        .correo-bienvenida {
            display: none;
        }

        .correo-bienvenida.visible {
            display: block;
        }

        .correo-bienvenida span {
            display: block;

            margin-top: 12px;

            color: #e8eaed;

            font-size: 16px;
            line-height: 1.4;

            word-break: break-word;
        }

        /* =================================
           MOSTRAR CONTRASEÑA
        ================================= */

        .mostrar {
            display: flex;
            align-items: center;

            gap: 10px;
            margin-top: 12px;

            color: #e8eaed;
            font-size: 14px;

            cursor: pointer;
        }

        .mostrar input {
            width: 18px;
            height: 18px;

            accent-color: #8ab4f8;
            cursor: pointer;
        }

        /* =================================
           ENLACES
        ================================= */

        .enlace {
            display: inline-block;

            margin-top: 22px;

            color: #8ab4f8;
            text-decoration: none;

            font-size: 14px;
            font-weight: 500;
        }

        .enlace:hover {
            text-decoration: underline;
        }

        /* =================================
           ACCIONES
        ================================= */

        .acciones {
            margin-top: 48px;

            display: flex;
            align-items: center;
            justify-content: flex-end;

            gap: 28px;
        }

        .crear {
            color: #8ab4f8;

            text-decoration: none;

            font-size: 14px;
            font-weight: bold;
        }

        .crear:hover {
            text-decoration: underline;
        }

        /* =================================
           BOTON
        ================================= */

        button {
            border: none;
            border-radius: 24px;

            padding: 13px 25px;
            min-width: 108px;

            background: #a8c7fa;
            color: #202124;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.1s;
        }

        button:hover {
            background: #c1d6fa;
        }

        button:active {
            transform: scale(0.97);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* =================================
           MENSAJE
        ================================= */

        #mensaje {
            margin-top: 22px;

            min-height: 20px;

            font-size: 14px;
            color: #bdc1c6;
        }

        /* =================================
           PIE
        ================================= */

        .pie {
            display: flex;

            justify-content: space-between;
            align-items: center;

            padding: 20px 16px 0;

            color: #bdc1c6;
            font-size: 12px;
        }

        .pie-derecha {
            display: flex;
            gap: 28px;
        }

        .pie a {
            color: #bdc1c6;
            text-decoration: none;
        }

        .pie a:hover {
            text-decoration: underline;
        }

        /* =================================
           CELULAR
        ================================= */

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .tarjeta {
                min-height: auto;

                display: block;

                padding: 32px 25px;

                border-radius: 22px;
            }

            .izquierda {
                margin-bottom: 38px;
            }

            .logo {
                margin-bottom: 25px;
            }

            h1 {
                font-size: 30px;
            }

            .descripcion {
                margin-top: 14px;
            }

            .derecha {
                display: block;
            }

            .acciones {
                margin-top: 35px;
                justify-content: space-between;
            }

            .pie {
                padding-left: 8px;
                padding-right: 8px;

                flex-direction: column;
                align-items: flex-start;

                gap: 18px;
            }

            .pie-derecha {
                gap: 20px;
            }
        }

        /* =================================
           CELULAR PEQUEÑO
        ================================= */

        @media (max-width: 400px) {

            h1 {
                font-size: 27px;
            }

            .tarjeta {
                padding: 28px 20px;
            }

            .acciones {
                gap: 15px;
            }
        }

    </style>
</head>

<body>

    <div class="pagina">

        <div class="tarjeta">

            <!-- =================================
                 IZQUIERDA
            ================================= -->

            <div class="izquierda">

                <div class="logo">
                    A
                </div>

                <h1 id="titulo">
                    Accede a tu cuenta
                </h1>

                <div
                    class="descripcion"
                    id="descripcion"
                >
                    Usa tu Cuenta de Google.
                </div>

                <!-- CORREO EN SEGUNDA PANTALLA -->

                <div
                    class="correo-bienvenida"
                    id="correoBienvenida"
                >
                    <span id="correoBienvenidaTexto"></span>
                </div>

            </div>


            <!-- =================================
                 DERECHA
            ================================= -->

            <div class="derecha">

                <!-- =================================
                     PASO 1
                ================================= -->

                <div
                    id="paso1"
                    class="paso"
                >

                    <form id="formularioCorreo">

                        <div
                            class="campo"
                            id="campoCorreo"
                        >

                            <input
                                type="text"
                                id="correo"
                                placeholder=" "
                                autocomplete="username"
                                required
                            >

                            <label for="correo">
                                Correo electrónico o teléfono
                            </label>

                        </div>

                        <!-- ERROR -->

                        <div
                            class="error-correo"
                            id="errorCorreo"
                        >
                            No se pudo encontrar esta cuenta
                        </div>


                        <div class="acciones">

                            <a
                                href="#"
                                class="crear"
                                id="crearCuenta1"
                            >
                                Crear cuenta
                            </a>

                            <button
                                type="submit"
                                id="botonCorreo"
                            >
                                Siguiente
                            </button>

                        </div>

                    </form>

                </div>


                <!-- =================================
                     PASO 2
                ================================= -->

                <div
                    id="paso2"
                    class="paso oculto"
                >

                    <div class="cuenta">

                        <div class="icono-cuenta">
                            👤
                        </div>

                        <span id="correoMostrado"></span>

                        <span>
                            ▾
                        </span>

                    </div>


                    <form id="formularioContrasena">

                        <div class="campo">

                            <input
                                type="password"
                                id="contrasena"
                                placeholder=" "
                                autocomplete="current-password"
                                required
                            >

                            <label for="contrasena">
                                Contraseña
                            </label>

                        </div>


                        <label class="mostrar">

                            <input
                                type="checkbox"
                                id="mostrarContrasena"
                            >

                            <span>
                                Mostrar contraseña
                            </span>

                        </label>


                        <a
                            href="#"
                            class="enlace"
                            id="recuperar"
                        >
                            ¿Olvidaste la contraseña?
                        </a>


                        <div class="acciones">

                            <a
                                href="#"
                                class="crear"
                                id="volver"
                            >
                                Atrás
                            </a>

                            <button
                                type="submit"
                                id="botonContrasena"
                            >
                                Siguiente
                            </button>

                        </div>

                    </form>

                </div>


                <!-- MENSAJE GENERAL -->

                <div id="mensaje"></div>

            </div>

        </div>


        <!-- =================================
             PIE
        ================================= -->

        <div class="pie">

            <div>
                Español (Latinoamérica)
            </div>

            <div class="pie-derecha">

                <a href="#">
                    Ayuda
                </a>

                <a href="#">
                    Privacidad
                </a>

                <a href="#">
                    Condiciones
                </a>

            </div>

        </div>

    </div>


    <script>

        /* =================================
           ELEMENTOS
        ================================= */

        const paso1 =
            document.getElementById("paso1");

        const paso2 =
            document.getElementById("paso2");

        const correo =
            document.getElementById("correo");

        const correoMostrado =
            document.getElementById("correoMostrado");

        const correoBienvenida =
            document.getElementById("correoBienvenida");

        const correoBienvenidaTexto =
            document.getElementById("correoBienvenidaTexto");

        const campoCorreo =
            document.getElementById("campoCorreo");

        const errorCorreo =
            document.getElementById("errorCorreo");

        const contrasena =
            document.getElementById("contrasena");

        const mensaje =
            document.getElementById("mensaje");

        const titulo =
            document.getElementById("titulo");

        const descripcion =
            document.getElementById("descripcion");

        const botonContrasena =
            document.getElementById("botonContrasena");


        /* =================================
           VALIDAR Y NORMALIZAR CORREO
        ================================= */

        function obtenerCorreoValido(valor) {

            valor =
                valor.trim().toLowerCase();


            /*
             * Si solamente escriben el nombre,
             * agregamos automáticamente @gmail.com
             */

            if (
                valor !== "" &&
                !valor.includes("@")
            ) {

                valor =
                    valor + "@gmail.com";
            }


            /*
             * Validación de formato:
             *
             * nombre@gmail.com
             *
             * No acepta:
             * nombre@
             * nombre@gmail
             * nombre@dsaml
             * @gmail.com
             */

            const patron =
                /^[a-zA-Z0-9._%+-]+@gmail\.com$/;


            if (!patron.test(valor)) {

                return null;
            }


            return valor;
        }


        /* =================================
           QUITAR ERROR MIENTRAS ESCRIBE
        ================================= */

        correo.addEventListener(
            "input",
            function() {

                campoCorreo.classList.remove("error");

                errorCorreo.classList.remove("visible");

                mensaje.textContent = "";

            }
        );


        /* =================================
           PASO 1 → PASO 2
        ================================= */

        document
        .getElementById("formularioCorreo")
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const correoFinal =
                    obtenerCorreoValido(
                        correo.value
                    );


                /* =========================
                   CORREO NO VÁLIDO
                ========================= */

                if (!correoFinal) {

                    campoCorreo.classList.add("error");

                    errorCorreo.classList.add("visible");

                    correo.focus();

                    return;
                }


                /* =========================
                   CORREO CORRECTO
                ========================= */

                correo.value =
                    correoFinal;


                /*
                 * Mostrar el correo completo
                 * en la segunda pantalla.
                 */

                correoMostrado.textContent =
                    correoFinal;


                correoBienvenidaTexto.textContent =
                    correoFinal;


                correoBienvenida.classList.add("visible");


                /* Cambiar contenido izquierdo */

                titulo.textContent =
                    "Te damos la bienvenida";


                descripcion.textContent =
                    "Ingresa tu contraseña para continuar.";


                /* Ocultar error */

                campoCorreo.classList.remove("error");

                errorCorreo.classList.remove("visible");


                /* Ocultar paso 1 */

                paso1.classList.add("oculto");


                /* Mostrar paso 2 */

                paso2.classList.remove("oculto");


                /* Limpiar mensaje */

                mensaje.textContent = "";


                /* Enfocar contraseña */

                setTimeout(function() {

                    contrasena.focus();

                }, 100);

            }
        );


        /* =================================
           MOSTRAR / OCULTAR CONTRASEÑA
        ================================= */

        document
        .getElementById("mostrarContrasena")
        .addEventListener(
            "change",
            function() {

                if (this.checked) {

                    contrasena.type =
                        "text";

                } else {

                    contrasena.type =
                        "password";

                }

            }
        );


        /* =================================
           VOLVER AL CORREO
        ================================= */

        document
        .getElementById("volver")
        .addEventListener(
            "click",
            function(event) {

                event.preventDefault();


                paso2.classList.add("oculto");

                paso1.classList.remove("oculto");


                titulo.textContent =
                    "Accede a tu cuenta";


                descripcion.textContent =
                    "Usa tu correo electrónico para continuar.";


                correoBienvenida.classList.remove("visible");


                mensaje.textContent = "";


                contrasena.value = "";


                correo.focus();

            }
        );


        /* =================================
           SEGUNDO PASO
        ================================= */

        document
        .getElementById("formularioContrasena")
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                if (!contrasena.value) {

                    mensaje.textContent =
                        "Ingresa tu contraseña.";

                    return;
                }


                botonContrasena.disabled =
                    true;


                botonContrasena.textContent =
                    "Comprobando...";


                setTimeout(function() {

                    mensaje.textContent =
                        "El sistema de autenticación está pendiente de configurar.";

                    botonContrasena.disabled =
                        false;

                    botonContrasena.textContent =
                        "Siguiente";

                }, 800);

            }
        );


        /* =================================
           RECUPERAR CONTRASEÑA
        ================================= */

        document
        .getElementById("recuperar")
        .addEventListener(
            "click",
            function(event) {

                event.preventDefault();


                mensaje.textContent =
                    "La recuperación de contraseña se configurará posteriormente.";

            }
        );


        /* =================================
           CREAR CUENTA
        ================================= */

        document
        .getElementById("crearCuenta1")
        .addEventListener(
            "click",
            function(event) {

                event.preventDefault();


                mensaje.textContent =
                    "El registro de cuentas se configurará posteriormente.";

            }
        );

    </script>

</body>
</html>
