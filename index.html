<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Accede a tu cuenta - Demo</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background: #202124;
    font-family: Arial, Helvetica, sans-serif;
    color: #e8eaed;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 40px 20px;
}

.pagina {
    width: 100%;
    max-width: 920px;
}

/* TARJETA */

.tarjeta {
    width: 100%;
    min-height: 420px;

    background: #0f0f0f;
    border-radius: 28px;

    padding: 40px 36px;

    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 70px;
}

/* IZQUIERDA */

.izquierda {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

/* LOGO */

.logo {
    width: 46px;
    height: 46px;
    margin-bottom: 28px;

    object-fit: contain;
}

/* TITULO */

h1 {
    margin: 0;

    font-size: 36px;
    line-height: 1.2;
    font-weight: 400;

    letter-spacing: -0.5px;

    color: #e8eaed;
}

/* DESCRIPCION */

.descripcion {
    margin-top: 18px;

    font-size: 16px;
    line-height: 1.5;

    color: #bdc1c6;
}

/* DERECHA */

.derecha {
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.paso {
    width: 100%;
}

.oculto {
    display: none;
}

/* CAMPO */

.campo {
    position: relative;
    margin-bottom: 8px;
}

input[type="text"],
input[type="password"] {
    width: 100%;
    height: 56px;

    padding: 15px;

    border-radius: 5px;
    border: 1px solid #8a8d91;

    background: transparent;

    color: #e8eaed;

    font-size: 16px;

    outline: none;

    transition:
        border-color .2s,
        box-shadow .2s;
}

input[type="text"]:hover,
input[type="password"]:hover {
    border-color: #bdc1c6;
}

input[type="text"]:focus,
input[type="password"]:focus {
    border: 2px solid #8ab4f8;
    padding: 14px;
}

input::placeholder {
    color: transparent;
}

/* LABEL */

.campo label {
    position: absolute;

    left: 13px;
    top: 18px;

    padding: 0 5px;

    background: #0f0f0f;

    color: #9aa0a6;

    font-size: 16px;

    pointer-events: none;

    transition:
        top .15s,
        font-size .15s,
        color .15s;
}

input:focus + label,
input:not(:placeholder-shown) + label {
    top: -8px;

    font-size: 12px;

    color: #8ab4f8;
}

/* ERROR */

.error-correo {
    display: none;

    margin-top: 8px;
    margin-left: 2px;

    color: #f28b82;

    font-size: 14px;
    line-height: 1.4;
}

.error-correo.visible {
    display: block;
}

.campo.error input {
    border-color: #f28b82;
}

.campo.error input:focus {
    border: 2px solid #f28b82;
}

.campo.error label {
    color: #f28b82;
}

/* CUENTA */

.cuenta {
    display: inline-flex;
    align-items: center;

    gap: 8px;

    padding: 7px 12px;
    margin-bottom: 25px;

    border: 1px solid #777;
    border-radius: 20px;

    color: #e8eaed;

    font-size: 14px;

    max-width: 100%;
}

.icono-cuenta {
    width: 22px;
    height: 22px;

    border-radius: 50%;
    border: 1px solid #aaa;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 12px;
}

#correoMostrado {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* CORREO BIENVENIDA */

.correo-bienvenida {
    display: none;
}

.correo-bienvenida.visible {
    display: block;
}

.correo-bienvenida span {
    display: block;

    margin-top: 12px;

    color: #e8eaed;

    font-size: 16px;
    line-height: 1.4;

    word-break: break-word;
}

/* MOSTRAR CONTRASEÑA */

.mostrar {
    display: flex;
    align-items: center;

    gap: 10px;

    margin-top: 12px;

    color: #e8eaed;

    font-size: 14px;

    cursor: pointer;
}

.mostrar input {
    width: 18px;
    height: 18px;

    accent-color: #8ab4f8;

    cursor: pointer;
}

/* ENLACES */

.enlace {
    display: inline-block;

    margin-top: 22px;

    color: #8ab4f8;

    text-decoration: none;

    font-size: 14px;
    font-weight: 500;
}

.enlace:hover {
    text-decoration: underline;
}

/* ACCIONES */

.acciones {
    margin-top: 48px;

    display: flex;
    align-items: center;
    justify-content: flex-end;

    gap: 28px;
}

/* BOTON SECUNDARIO */

.crear {
    color: #8ab4f8;

    text-decoration: none;

    font-size: 14px;
    font-weight: bold;
}

.crear:hover {
    text-decoration: underline;
}

/* BOTON */

button {
    border: none;

    border-radius: 24px;

    padding: 13px 25px;

    min-width: 108px;

    background: #a8c7fa;

    color: #202124;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

    transition:
        background .2s,
        transform .1s;
}

button:hover {
    background: #c1d6fa;
}

button:active {
    transform: scale(.97);
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

/* MENSAJE */

#mensaje {
    margin-top: 22px;

    min-height: 20px;

    font-size: 14px;

    color: #bdc1c6;
}

/* AVISO DEMO */

.aviso-demo {
    margin-top: 16px;

    padding: 10px 12px;

    border: 1px solid #5f6368;
    border-radius: 8px;

    color: #bdc1c6;

    font-size: 12px;

    line-height: 1.4;
}

/* PIE */

.pie {
    display: flex;

    justify-content: space-between;
    align-items: center;

    padding: 20px 16px 0;

    color: #bdc1c6;

    font-size: 12px;
}

.pie-derecha {
    display: flex;

    gap: 28px;
}

.pie a {
    color: #bdc1c6;

    text-decoration: none;
}

.pie a:hover {
    text-decoration: underline;
}

/* CELULAR */

@media (max-width: 700px) {

    body {
        padding: 15px;
    }

    .tarjeta {
        min-height: auto;

        display: block;

        padding: 32px 25px;

        border-radius: 22px;
    }

    .izquierda {
        margin-bottom: 38px;
    }

    .logo {
        margin-bottom: 25px;
    }

    h1 {
        font-size: 30px;
    }

    .descripcion {
        margin-top: 14px;
    }

    .derecha {
        display: block;
    }

    .acciones {
        margin-top: 35px;

        justify-content: space-between;
    }

    .pie {
        padding-left: 8px;
        padding-right: 8px;

        flex-direction: column;

        align-items: flex-start;

        gap: 18px;
    }

    .pie-derecha {
        gap: 20px;
    }
}

/* CELULAR PEQUEÑO */

@media (max-width: 400px) {

    h1 {
        font-size: 27px;
    }

    .tarjeta {
        padding: 28px 20px;
    }

    .acciones {
        gap: 15px;
    }
}
</style>
</head>

<body>

<div class="pagina">

    <div class="tarjeta">

        <!-- IZQUIERDA -->

        <div class="izquierda">

            <!-- Logo utilizado únicamente como elemento visual -->
            <img
                src="google-logo-png-google-icon-logo-png-transparent-svg-vector-bie-supply-14.png"
                class="logo"
                alt="Logo"
            >

            <h1 id="titulo">
                Accede a tu cuenta
            </h1>

            <div
                class="descripcion"
                id="descripcion"
            >
                Usa tu Cuenta de Google.
            </div>

            <div
                class="correo-bienvenida"
                id="correoBienvenida"
            >
                <span id="correoBienvenidaTexto"></span>
            </div>

        </div>


        <!-- DERECHA -->

        <div class="derecha">

            <!-- PASO 1 -->

            <div
                id="paso1"
                class="paso"
            >

                <form id="formularioCorreo">

                    <div
                        class="campo"
                        id="campoCorreo"
                    >

                        <input
                            type="text"
                            id="correo"
                            placeholder=" "
                            autocomplete="off"
                            required
                        >

                        <label for="correo">
                            Correo electrónico o teléfono
                        </label>

                    </div>


                    <div
                        class="error-correo"
                        id="errorCorreo"
                    >
                        Introduce una dirección de Gmail válida.
                    </div>


                    <div class="acciones">

                        <a
                            href="#"
                            class="crear"
                            id="crearCuenta1"
                        >
                            Crear cuenta
                        </a>

                        <button
                            type="submit"
                            id="botonCorreo"
                        >
                            Siguiente
                        </button>

                    </div>

                </form>

            </div>


            <!-- PASO 2 -->

            <div
                id="paso2"
                class="paso oculto"
            >

                <div class="cuenta">

                    <div class="icono-cuenta">
                        👤
                    </div>

                    <span id="correoMostrado"></span>

                    <span>
                        ▾
                    </span>

                </div>


                <form id="formularioContrasena">

                    <div class="campo">

                        <input
                            type="password"
                            id="contrasena"
                            placeholder=" "
                            autocomplete="off"
                        >

                        <label for="contrasena">
                            Contraseña
                        </label>

                    </div>


                    <label class="mostrar">

                        <input
                            type="checkbox"
                            id="mostrarContrasena"
                        >

                        <span>
                            Mostrar contraseña
                        </span>

                    </label>


                    <a
                        href="#"
                        class="enlace"
                        id="recuperar"
                    >
                        ¿Olvidaste la contraseña?
                    </a>


                    <div class="acciones">

                        <a
                            href="#"
                            class="crear"
                            id="volver"
                        >
                            Atrás
                        </a>

                        <button
                            type="submit"
                            id="botonContrasena"
                        >
                            Siguiente
                        </button>

                    </div>

                </form>


                <div class="aviso-demo">
                    Esta es una demostración de interfaz.
                    No se envían ni almacenan contraseñas.
                </div>

            </div>


            <div id="mensaje"></div>

        </div>

    </div>


    <!-- PIE -->

    <div class="pie">

        <div>
            Español (Latinoamérica)
        </div>

        <div class="pie-derecha">

            <a href="#">
                Ayuda
            </a>

            <a href="#">
                Privacidad
            </a>

            <a href="#">
                Condiciones
            </a>

        </div>

    </div>

</div>


<script>

/* =========================================
   ELEMENTOS
========================================= */

const paso1 =
    document.getElementById("paso1");

const paso2 =
    document.getElementById("paso2");

const correo =
    document.getElementById("correo");

const correoMostrado =
    document.getElementById("correoMostrado");

const correoBienvenida =
    document.getElementById("correoBienvenida");

const correoBienvenidaTexto =
    document.getElementById("correoBienvenidaTexto");

const campoCorreo =
    document.getElementById("campoCorreo");

const errorCorreo =
    document.getElementById("errorCorreo");

const contrasena =
    document.getElementById("contrasena");

const mensaje =
    document.getElementById("mensaje");

const titulo =
    document.getElementById("titulo");

const descripcion =
    document.getElementById("descripcion");


/* =========================================
   VALIDAR Y NORMALIZAR CORREO
========================================= */

function obtenerCorreoValido(valor) {

    valor =
        valor.trim().toLowerCase();

    /*
       Si escribe solamente el nombre,
       se agrega @gmail.com automáticamente.
    */

    if (
        valor !== "" &&
        !valor.includes("@")
    ) {

        valor =
            valor + "@gmail.com";
    }


    /*
       Formato permitido:

       nombre@gmail.com

       No permite:

       nombre@
       nombre@gmail
       nombre@dsaml
       @gmail.com
    */

    const patron =
        /^[a-zA-Z0-9._%+-]+@gmail\.com$/;


    if (!patron.test(valor)) {

        return null;
    }


    return valor;
}


/* =========================================
   QUITAR ERROR AL ESCRIBIR
========================================= */

correo.addEventListener(
    "input",
    function() {

        campoCorreo.classList.remove("error");

        errorCorreo.classList.remove("visible");

        mensaje.textContent = "";

    }
);


/* =========================================
   PASO 1
========================================= */

document
.getElementById("formularioCorreo")
.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const correoFinal =
            obtenerCorreoValido(
                correo.value
            );


        if (!correoFinal) {

            campoCorreo.classList.add("error");

            errorCorreo.classList.add("visible");

            correo.focus();

            return;
        }


        correo.value =
            correoFinal;


        correoMostrado.textContent =
            correoFinal;


        correoBienvenidaTexto.textContent =
            correoFinal;


        correoBienvenida.classList.add("visible");


        titulo.textContent =
            "Te damos la bienvenida";


        descripcion.textContent =
            "Ingresa tu contraseña para continuar.";


        campoCorreo.classList.remove("error");

        errorCorreo.classList.remove("visible");


        paso1.classList.add("oculto");

        paso2.classList.remove("oculto");

        mensaje.textContent = "";


        setTimeout(
            function() {

                contrasena.focus();

            },
            100
        );

    }
);


/* =========================================
   MOSTRAR / OCULTAR CONTRASEÑA
========================================= */

document
.getElementById("mostrarContrasena")
.addEventListener(
    "change",
    function() {

        if (this.checked) {

            contrasena.type =
                "text";

        } else {

            contrasena.type =
                "password";
        }

    }
);


/* =========================================
   VOLVER
========================================= */

document
.getElementById("volver")
.addEventListener(
    "click",
    function(event) {

        event.preventDefault();


        paso2.classList.add("oculto");

        paso1.classList.remove("oculto");


        titulo.textContent =
            "Accede a tu cuenta";


        descripcion.textContent =
            "Usa tu Cuenta de Google.";


        correoBienvenida.classList.remove("visible");


        mensaje.textContent = "";


        contrasena.value = "";


        correo.focus();

    }
);


/* =========================================
   SEGUNDO PASO
   SOLO DEMOSTRACIÓN
========================================= */

document
.getElementById("formularioContrasena")
.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        /*
           No se envía ni se almacena
           ninguna contraseña.
        */

        mensaje.textContent =
            "Demostración: la contraseña no se envía ni se almacena.";

    }
);


/* =========================================
   RECUPERAR
========================================= */

document
.getElementById("recuperar")
.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        mensaje.textContent =
            "Opción disponible únicamente en la demostración.";

    }
);


/* =========================================
   CREAR CUENTA
========================================= */

document
.getElementById("crearCuenta1")
.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        mensaje.textContent =
            "Opción disponible únicamente en la demostración.";

    }
);

</script>

</body>
</html>
