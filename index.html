<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accede a tu cuenta</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            background: #1f2021;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #e8eaed;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }


        /* =========================
           CONTENEDOR PRINCIPAL
        ========================= */

        .pagina {
            width: 100%;
            max-width: 920px;
        }


        .tarjeta {
            width: 100%;
            min-height: 420px;

            background: #0f0f0f;

            border-radius: 28px;

            padding: 40px 36px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            column-gap: 70px;
        }


        /* =========================
           COLUMNA IZQUIERDA
        ========================= */

        .izquierda {
            display: flex;

            flex-direction: column;

            align-items: flex-start;
        }


        /* LOGO PROPIO */

        .logo {
            width: 52px;
            height: 52px;

            margin-bottom: 30px;

            border-radius: 50%;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 25px;

            font-weight: bold;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #4285f4 0%,
                    #34a853 35%,
                    #fbbc05 65%,
                    #ea4335 100%
                );
        }


        /* TITULO */

        h1 {
            margin: 0;

            font-size: 36px;

            line-height: 1.2;

            font-weight: 400;

            letter-spacing: -0.5px;

            color: #e8eaed;
        }


        /* TEXTO */

        .descripcion {
            margin-top: 18px;

            font-size: 16px;

            line-height: 1.5;

            color: #bdc1c6;
        }


        /* =========================
           COLUMNA DERECHA
        ========================= */

        .derecha {
            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        /* =========================
           CAMPOS
        ========================= */

        .campo {
            position: relative;

            margin-bottom: 24px;
        }


        input {
            width: 100%;

            height: 56px;

            padding: 15px;

            border-radius: 5px;

            border: 1px solid #8a8d91;

            background: transparent;

            color: #e8eaed;

            font-size: 16px;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }


        input:hover {
            border-color: #bdc1c6;
        }


        input:focus {
            border: 2px solid #8ab4f8;

            padding: 14px;

            box-shadow:
                0 0 0 1px rgba(138, 180, 248, 0.08);
        }


        input::placeholder {
            color: transparent;
        }


        /* LABEL FLOTANTE */

        .campo label {
            position: absolute;

            left: 13px;

            top: 18px;

            padding: 0 5px;

            background: #0f0f0f;

            color: #9aa0a6;

            font-size: 16px;

            pointer-events: none;

            transition:
                top 0.15s,
                font-size 0.15s,
                color 0.15s;
        }


        input:focus + label,
        input:not(:placeholder-shown) + label {
            top: -8px;

            font-size: 12px;

            color: #8ab4f8;
        }


        /* =========================
           OLVIDASTE CONTRASEÑA
        ========================= */

        .recuperar {
            display: inline-block;

            margin-top: -7px;

            color: #8ab4f8;

            text-decoration: none;

            font-size: 14px;

            font-weight: 500;

            cursor: pointer;
        }


        .recuperar:hover {
            text-decoration: underline;
        }


        /* =========================
           PARTE INFERIOR
        ========================= */

        .acciones {
            margin-top: 48px;

            display: flex;

            align-items: center;

            justify-content: flex-end;

            gap: 28px;
        }


        .crear {
            color: #8ab4f8;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;
        }


        .crear:hover {
            text-decoration: underline;
        }


        /* =========================
           BOTÓN
        ========================= */

        button {
            border: none;

            border-radius: 24px;

            padding: 13px 25px;

            min-width: 108px;

            background: #a8c7fa;

            color: #202124;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.1s;
        }


        button:hover {
            background: #c1d6fa;
        }


        button:active {
            transform: scale(0.97);
        }


        button:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }


        /* =========================
           MENSAJE
        ========================= */

        #mensaje {
            margin-top: 22px;

            min-height: 20px;

            font-size: 14px;

            color: #bdc1c6;
        }


        /* =========================
           PIE
        ========================= */

        .pie {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 20px 16px 0;

            color: #bdc1c6;

            font-size: 12px;
        }


        .pie-derecha {
            display: flex;

            gap: 28px;
        }


        .pie a {
            color: #bdc1c6;

            text-decoration: none;
        }


        .pie a:hover {
            text-decoration: underline;
        }


        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }


            .tarjeta {
                min-height: auto;

                display: block;

                padding: 32px 25px;

                border-radius: 22px;
            }


            .izquierda {
                margin-bottom: 38px;
            }


            .logo {
                margin-bottom: 25px;
            }


            h1 {
                font-size: 30px;
            }


            .descripcion {
                margin-top: 14px;
            }


            .derecha {
                display: block;
            }


            .acciones {
                margin-top: 35px;

                justify-content: space-between;
            }


            .pie {
                padding-left: 8px;

                padding-right: 8px;

                flex-direction: column;

                align-items: flex-start;

                gap: 18px;
            }


            .pie-derecha {
                gap: 20px;
            }

        }


        /* =========================
           CELULAR PEQUEÑO
        ========================= */

        @media (max-width: 400px) {

            h1 {
                font-size: 27px;
            }


            .tarjeta {
                padding: 28px 20px;
            }


            .acciones {
                gap: 15px;
            }

        }

    </style>
</head>


<body>


    <div class="pagina">


        <!-- =====================
             TARJETA
        ====================== -->

        <div class="tarjeta">


            <!-- =====================
                 IZQUIERDA
            ====================== -->

            <div class="izquierda">


                <!-- LOGO -->

                <div class="logo">
                    A
                </div>


                <!-- TITULO -->

                <h1>
                    Accede a tu cuenta
                </h1>


                <!-- DESCRIPCION -->

                <div class="descripcion">
                    Usa tu correo electrónico y contraseña
                    para acceder a tu cuenta.
                </div>


            </div>



            <!-- =====================
                 DERECHA
            ====================== -->

            <div class="derecha">


                <form id="formulario">


                    <!-- CORREO -->

                    <div class="campo">

                        <input
                            type="email"
                            id="correo"
                            placeholder=" "
                            autocomplete="username"
                            required
                        >

                        <label for="correo">
                            Correo electrónico
                        </label>

                    </div>


                    <!-- CONTRASEÑA -->

                    <div class="campo">

                        <input
                            type="password"
                            id="contrasena"
                            placeholder=" "
                            autocomplete="current-password"
                            required
                        >

                        <label for="contrasena">
                            Contraseña
                        </label>

                    </div>


                    <!-- RECUPERAR -->

                    <a
                        href="#"
                        class="recuperar"
                        id="recuperar"
                    >
                        ¿Olvidaste tu contraseña?
                    </a>


                    <!-- ACCIONES -->

                    <div class="acciones">

                        <a
                            href="#"
                            class="crear"
                            id="crearCuenta"
                        >
                            Crear cuenta
                        </a>


                        <button
                            type="submit"
                            id="botonIngresar"
                        >
                            Siguiente
                        </button>

                    </div>


                </form>


                <!-- MENSAJE -->

                <div id="mensaje"></div>


            </div>

        </div>



        <!-- =====================
             PIE DE PÁGINA
        ====================== -->

        <div class="pie">


            <div>
                Español (Latinoamérica)
            </div>


            <div class="pie-derecha">

                <a href="#">
                    Ayuda
                </a>

                <a href="#">
                    Privacidad
                </a>

                <a href="#">
                    Condiciones
                </a>

            </div>


        </div>


    </div>



    <script>

        const formulario =
            document.getElementById("formulario");

        const mensaje =
            document.getElementById("mensaje");

        const boton =
            document.getElementById("botonIngresar");



        /* =========================
           INICIO DE SESIÓN
        ========================= */

        formulario.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const correo =
                    document
                    .getElementById("correo")
                    .value
                    .trim();


                const contrasena =
                    document
                    .getElementById("contrasena")
                    .value;


                if (!correo || !contrasena) {

                    mensaje.textContent =
                        "Completa todos los campos.";

                    return;
                }


                boton.disabled = true;

                boton.textContent =
                    "Comprobando...";


                /*
                    AQUÍ SE CONECTARÁ EL SISTEMA
                    DE AUTENTICACIÓN SEGURO.

                    La contraseña NO se envía
                    a Google Sheets.
                */


                setTimeout(function() {

                    mensaje.textContent =
                        "El sistema de acceso está listo para configurar.";

                    boton.disabled = false;

                    boton.textContent =
                        "Siguiente";

                }, 800);

            }
        );



        /* =========================
           RECUPERAR CONTRASEÑA
        ========================= */

        document
        .getElementById("recuperar")
        .addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                mensaje.textContent =
                    "La recuperación de contraseña se configurará próximamente.";

            }
        );



        /* =========================
           CREAR CUENTA
        ========================= */

        document
        .getElementById("crearCuenta")
        .addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                mensaje.textContent =
                    "El registro de nuevas cuentas se configurará próximamente.";

            }
        );

    </script>


</body>
</html>
