<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Google Demo</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;

    background: #202124;

    font-family: Arial, Helvetica, sans-serif;

    color: #e8eaed;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 24px;
}


/* ================================
   GOOGLE DEMO
================================ */

.demo {
    position: fixed;

    top: 14px;
    right: 16px;

    padding: 6px 10px;

    background: rgba(255,255,255,0.08);

    border: 1px solid rgba(255,255,255,0.18);

    border-radius: 5px;

    color: #bdc1c6;

    font-size: 11px;

    font-weight: 600;

    letter-spacing: .6px;

    z-index: 1000;
}


/* ================================
   PAGINA
================================ */

.pagina {
    width: 100%;
    max-width: 920px;
}


/* ================================
   TARJETA
================================ */

.tarjeta {
    width: 100%;

    min-height: 420px;

    background: #0f0f0f;

    border-radius: 28px;

    padding: 40px 36px;

    display: grid;

    grid-template-columns: 1fr 1fr;

    column-gap: 68px;
}


/* ================================
   IZQUIERDA
================================ */

.izquierda {
    display: flex;

    flex-direction: column;

    align-items: flex-start;
}


/* ================================
   LOGO PNG
================================ */

.logo {
    width: 46px;
    height: 46px;

    object-fit: contain;

    margin-bottom: 28px;
}


/* ================================
   TITULO
================================ */

h1 {
    margin: 0;

    font-size: 36px;

    line-height: 1.22;

    font-weight: 400;

    letter-spacing: -0.7px;

    color: #e8eaed;
}


/* ================================
   DESCRIPCION
================================ */

.descripcion {
    margin-top: 18px;

    font-size: 16px;

    line-height: 1.5;

    color: #bdc1c6;
}


/* ================================
   BIENVENIDA
================================ */

.correo-bienvenida {
    display: none;
}

.correo-bienvenida.visible {
    display: block;
}

.correo-bienvenida span {
    display: block;

    margin-top: 13px;

    color: #e8eaed;

    font-size: 16px;

    line-height: 1.4;

    word-break: break-word;
}


/* ================================
   DERECHA
================================ */

.derecha {
    display: flex;

    flex-direction: column;

    justify-content: center;
}

.paso {
    width: 100%;
}

.oculto {
    display: none;
}


/* ================================
   CAMPO
================================ */

.campo {
    position: relative;

    width: 100%;

    margin-bottom: 8px;
}

.campo input {
    width: 100%;

    height: 56px;

    padding: 15px;

    border: 1px solid #8a8d91;

    border-radius: 4px;

    background: transparent;

    color: #e8eaed;

    font-size: 16px;

    outline: none;

    transition: .15s;
}

.campo input:hover {
    border-color: #bdc1c6;
}

.campo input:focus {
    border: 2px solid #8ab4f8;

    padding: 14px;
}

.campo input::placeholder {
    color: transparent;
}


/* ================================
   LABEL
================================ */

.campo label {
    position: absolute;

    left: 13px;

    top: 18px;

    padding: 0 5px;

    background: #0f0f0f;

    color: #9aa0a6;

    font-size: 16px;

    pointer-events: none;

    transition: .15s;
}

.campo input:focus + label,
.campo input:not(:placeholder-shown) + label {
    top: -8px;

    font-size: 12px;

    color: #8ab4f8;
}


/* ================================
   ERROR
================================ */

.error-correo {
    display: none;

    margin-top: 8px;

    margin-left: 2px;

    color: #f28b82;

    font-size: 14px;

    line-height: 1.4;
}

.error-correo.visible {
    display: block;
}

.campo.error input {
    border-color: #f28b82;
}

.campo.error label {
    color: #f28b82;
}


/* ================================
   CUENTA
================================ */

.cuenta {
    display: inline-flex;

    align-items: center;

    gap: 8px;

    max-width: 100%;

    padding: 7px 12px;

    margin-bottom: 25px;

    border: 1px solid #777;

    border-radius: 20px;

    color: #e8eaed;

    font-size: 14px;
}

.icono-cuenta {
    width: 22px;
    height: 22px;

    border: 1px solid #aaa;

    border-radius: 50%;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 11px;
}

#correoMostrado {
    max-width: 270px;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}


/* ================================
   MOSTRAR CONTRASEÑA
================================ */

.mostrar {
    display: flex;

    align-items: center;

    gap: 10px;

    margin-top: 12px;

    color: #e8eaed;

    font-size: 14px;

    cursor: pointer;
}

.mostrar input {
    width: 18px;
    height: 18px;

    accent-color: #8ab4f8;

    cursor: pointer;
}


/* ================================
   ENLACE
================================ */

.enlace {
    display: inline-block;

    margin-top: 22px;

    color: #8ab4f8;

    text-decoration: none;

    font-size: 14px;

    font-weight: 500;
}

.enlace:hover {
    text-decoration: underline;
}


/* ================================
   ACCIONES
================================ */

.acciones {
    margin-top: 48px;

    display: flex;

    align-items: center;

    justify-content: flex-end;

    gap: 28px;
}

.crear {
    color: #8ab4f8;

    text-decoration: none;

    font-size: 14px;

    font-weight: 600;
}

.crear:hover {
    text-decoration: underline;
}


/* ================================
   BOTON
================================ */

button {
    min-width: 108px;

    padding: 13px 25px;

    border: none;

    border-radius: 24px;

    background: #a8c7fa;

    color: #202124;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;
}

button:hover {
    background: #c1d6fa;
}

button:active {
    transform: scale(.97);
}


/* ================================
   MENSAJE
================================ */

#mensaje {
    min-height: 20px;

    margin-top: 22px;

    color: #bdc1c6;

    font-size: 14px;
}


/* ================================
   AVISO DEMO
================================ */

.aviso-demo {
    margin-top: 20px;

    padding: 9px 12px;

    border: 1px solid #3c4043;

    border-radius: 7px;

    color: #9aa0a6;

    font-size: 11px;

    line-height: 1.4;
}


/* ================================
   PIE
================================ */

.pie {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 20px 16px 0;

    color: #bdc1c6;

    font-size: 12px;
}

.pie-derecha {
    display: flex;

    gap: 28px;
}

.pie a {
    color: #bdc1c6;

    text-decoration: none;
}

.pie a:hover {
    text-decoration: underline;
}


/* ================================
   CELULAR
================================ */

@media (max-width: 700px) {

    body {
        padding: 15px;
    }

    .tarjeta {
        min-height: auto;

        display: block;

        padding: 32px 25px;

        border-radius: 22px;
    }

    .izquierda {
        margin-bottom: 38px;
    }

    .logo {
        margin-bottom: 25px;
    }

    h1 {
        font-size: 30px;
    }

    .descripcion {
        margin-top: 14px;
    }

    .derecha {
        display: block;
    }

    .acciones {
        margin-top: 35px;

        justify-content: space-between;
    }

    .pie {
        padding: 18px 8px 0;

        flex-direction: column;

        align-items: flex-start;

        gap: 18px;
    }

    .pie-derecha {
        gap: 20px;
    }
}


/* ================================
   CELULAR PEQUEÑO
================================ */

@media (max-width: 400px) {

    h1 {
        font-size: 27px;
    }

    .tarjeta {
        padding: 28px 20px;
    }

    .acciones {
        gap: 15px;
    }

    .demo {
        top: 8px;
        right: 8px;

        font-size: 9px;
    }
}

</style>
</head>


<body>


<!-- ================================
     ETIQUETA DEMO
================================ -->

<div class="demo">
    GOOGLE DEMO
</div>


<div class="pagina">


    <!-- ================================
         TARJETA
    ================================= -->

    <div class="tarjeta">


        <!-- ================================
             IZQUIERDA
        ================================= -->

        <div class="izquierda">


            <!-- AQUÍ SE CARGA google.png -->

            <img
                src="google.png"
                class="logo"
                alt="Google Demo"
            >


            <h1 id="titulo">
                Accede a tu cuenta
            </h1>


            <div
                class="descripcion"
                id="descripcion"
            >
                Usa tu Cuenta de Google
            </div>


            <div
                class="correo-bienvenida"
                id="correoBienvenida"
            >

                <span id="correoBienvenidaTexto"></span>

            </div>

        </div>


        <!-- ================================
             DERECHA
        ================================= -->

        <div class="derecha">


            <!-- ================================
                 PASO 1
            ================================= -->

            <div
                id="paso1"
                class="paso"
            >

                <form id="formularioCorreo">


                    <div
                        class="campo"
                        id="campoCorreo"
                    >

                        <input
                            type="text"
                            id="correo"
                            placeholder=" "
                            autocomplete="off"
                            required
                        >

                        <label for="correo">
                            Correo electrónico o teléfono
                        </label>

                    </div>


                    <div
                        class="error-correo"
                        id="errorCorreo"
                    >
                        Introduce una dirección de Gmail válida.
                    </div>


                    <div class="acciones">


                        <a
                            href="#"
                            class="crear"
                            id="crearCuenta1"
                        >
                            Crear cuenta
                        </a>


                        <button type="submit">
                            Siguiente
                        </button>


                    </div>


                </form>

            </div>


            <!-- ================================
                 PASO 2
            ================================= -->

            <div
                id="paso2"
                class="paso oculto"
            >


                <div class="cuenta">

                    <div class="icono-cuenta">
                        👤
                    </div>

                    <span id="correoMostrado"></span>

                    <span>
                        ▾
                    </span>

                </div>


                <div class="campo">

                    <input
                        type="password"
                        id="contrasena"
                        placeholder=" "
                        autocomplete="off"
                    >

                    <label for="contrasena">
                        Contraseña
                    </label>

                </div>


                <label class="mostrar">

                    <input
                        type="checkbox"
                        id="mostrarContrasena"
                    >

                    <span>
                        Mostrar contraseña
                    </span>

                </label>


                <a
                    href="#"
                    class="enlace"
                    id="recuperar"
                >
                    ¿Olvidaste la contraseña?
                </a>


                <div class="acciones">


                    <a
                        href="#"
                        class="crear"
                        id="volver"
                    >
                        Atrás
                    </a>


                    <button
                        type="button"
                        id="botonDemo"
                    >
                        Siguiente
                    </button>


                </div>


                <div class="aviso-demo">
                    Modo demostración: los datos introducidos
                    no se envían ni se almacenan.
                </div>


            </div>


            <div id="mensaje"></div>


        </div>

    </div>


    <!-- ================================
         PIE
    ================================= -->

    <div class="pie">


        <div>
            Español (Latinoamérica)
        </div>


        <div class="pie-derecha">

            <a href="#">
                Ayuda
            </a>

            <a href="#">
                Privacidad
            </a>

            <a href="#">
                Condiciones
            </a>

        </div>


    </div>

</div>


<script>

/* =========================================
   ELEMENTOS
========================================= */

const paso1 =
    document.getElementById("paso1");

const paso2 =
    document.getElementById("paso2");

const correo =
    document.getElementById("correo");

const correoMostrado =
    document.getElementById("correoMostrado");

const correoBienvenida =
    document.getElementById("correoBienvenida");

const correoBienvenidaTexto =
    document.getElementById("correoBienvenidaTexto");

const campoCorreo =
    document.getElementById("campoCorreo");

const errorCorreo =
    document.getElementById("errorCorreo");

const contrasena =
    document.getElementById("contrasena");

const mensaje =
    document.getElementById("mensaje");

const titulo =
    document.getElementById("titulo");

const descripcion =
    document.getElementById("descripcion");


/* =========================================
   VALIDAR CORREO
========================================= */

function obtenerCorreoValido(valor) {

    valor =
        valor.trim().toLowerCase();


    /*
       Si solamente escribe el nombre,
       agregamos @gmail.com
    */

    if (
        valor !== "" &&
        !valor.includes("@")
    ) {

        valor =
            valor + "@gmail.com";
    }


    /*
       Solo acepta Gmail
    */

    const patron =
        /^[a-zA-Z0-9._%+-]+@gmail\.com$/;


    if (!patron.test(valor)) {

        return null;
    }


    return valor;
}


/* =========================================
   QUITAR ERROR AL ESCRIBIR
========================================= */

correo.addEventListener(
    "input",
    function() {

        campoCorreo.classList.remove("error");

        errorCorreo.classList.remove("visible");

        mensaje.textContent = "";

    }
);


/* =========================================
   CORREO → SEGUNDO PASO
========================================= */

document
.getElementById("formularioCorreo")
.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const correoFinal =
            obtenerCorreoValido(
                correo.value
            );


        if (!correoFinal) {

            campoCorreo.classList.add("error");

            errorCorreo.classList.add("visible");

            correo.focus();

            return;
        }


        correo.value =
            correoFinal;


        correoMostrado.textContent =
            correoFinal;


        correoBienvenidaTexto.textContent =
            correoFinal;


        correoBienvenida.classList.add("visible");


        titulo.textContent =
            "Te damos la bienvenida";


        descripcion.textContent =
            "Ingresa tu contraseña para continuar.";


        paso1.classList.add("oculto");

        paso2.classList.remove("oculto");


        setTimeout(
            function() {

                contrasena.focus();

            },
            100
        );

    }
);


/* =========================================
   MOSTRAR CONTRASEÑA
========================================= */

document
.getElementById("mostrarContrasena")
.addEventListener(
    "change",
    function() {

        if (this.checked) {

            contrasena.type = "text";

        } else {

            contrasena.type = "password";

        }

    }
);


/* =========================================
   ATRAS
========================================= */

document
.getElementById("volver")
.addEventListener(
    "click",
    function(event) {

        event.preventDefault();


        paso2.classList.add("oculto");

        paso1.classList.remove("oculto");


        titulo.textContent =
            "Accede a tu cuenta";


        descripcion.textContent =
            "Usa tu Cuenta de Google";


        correoBienvenida.classList.remove("visible");


        contrasena.value = "";

        mensaje.textContent = "";


        correo.focus();

    }
);


/* =========================================
   BOTON DEMO
========================================= */

document
.getElementById("botonDemo")
.addEventListener(
    "click",
    function() {

        mensaje.textContent =
            "Esta es una demostración. No se envió ninguna contraseña.";

    }
);


/* =========================================
   RECUPERAR
========================================= */

document
.getElementById("recuperar")
.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        mensaje.textContent =
            "Función disponible únicamente en la demostración.";

    }
);


/* =========================================
   CREAR CUENTA
========================================= */

document
.getElementById("crearCuenta1")
.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        mensaje.textContent =
            "Función disponible únicamente en la demostración.";

    }
);

</script>

</body>
</html>
