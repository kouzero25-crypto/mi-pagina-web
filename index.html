<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cuenta Demo</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    background: #1f2021;

    font-family: Arial, Helvetica, sans-serif;

    color: #e8eaed;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}


/* =====================================================
   CONTENEDOR PRINCIPAL
===================================================== */

.pagina {
    width: 100%;

    max-width: 920px;
}


/* =====================================================
   TARJETA
===================================================== */

.tarjeta {
    width: 100%;

    height: 422px;

    background: #0f0f0f;

    border-radius: 27px;

    padding: 40px 36px;

    display: grid;

    grid-template-columns: 1fr 1fr;

    column-gap: 66px;
}


/* =====================================================
   IZQUIERDA
===================================================== */

.izquierda {
    display: flex;

    flex-direction: column;

    align-items: flex-start;
}


/* =====================================================
   LOGO
===================================================== */

.logo {
    width: 46px;

    height: 46px;

    object-fit: contain;

    margin-bottom: 26px;
}


/* =====================================================
   TITULO
===================================================== */

h1 {
    margin: 0;

    font-size: 36px;

    line-height: 1.2;

    font-weight: 400;

    letter-spacing: -0.6px;

    color: #e8eaed;
}


/* =====================================================
   DESCRIPCION
===================================================== */

.descripcion {
    margin-top: 18px;

    font-size: 16px;

    line-height: 1.5;

    color: #bdc1c6;
}


/* =====================================================
   DERECHA
===================================================== */

.derecha {
    display: flex;

    flex-direction: column;

    justify-content: center;

    padding-top: 8px;
}


/* =====================================================
   CAMPO
===================================================== */

.campo {
    position: relative;

    width: 100%;

    margin-top: -1px;
}

.campo input {
    width: 100%;

    height: 56px;

    padding: 15px;

    border: 1px solid #8a8d91;

    border-radius: 4px;

    background: transparent;

    color: #e8eaed;

    font-size: 16px;

    outline: none;
}

.campo input:hover {
    border-color: #bdc1c6;
}

.campo input:focus {
    border: 2px solid #8ab4f8;

    padding: 14px;
}


/* =====================================================
   LABEL
===================================================== */

.campo label {
    position: absolute;

    left: 13px;

    top: 18px;

    padding: 0 5px;

    color: #9aa0a6;

    background: #0f0f0f;

    font-size: 16px;

    pointer-events: none;

    transition: 0.15s;
}

.campo input:focus + label,
.campo input:not(:placeholder-shown) + label {
    top: -8px;

    font-size: 12px;

    color: #8ab4f8;
}


/* =====================================================
   ENLACE
===================================================== */

.enlace {
    display: inline-block;

    margin-top: 11px;

    color: #8ab4f8;

    font-size: 14px;

    font-weight: 500;

    text-decoration: none;
}

.enlace:hover {
    text-decoration: underline;
}


/* =====================================================
   TEXTO INFORMATIVO
===================================================== */

.informacion {
    margin-top: 43px;

    max-width: 395px;

    color: #bdc1c6;

    font-size: 14px;

    line-height: 1.5;
}

.informacion a {
    color: #8ab4f8;

    text-decoration: none;

    font-weight: 500;
}

.informacion a:hover {
    text-decoration: underline;
}


/* =====================================================
   ACCIONES
===================================================== */

.acciones {
    width: 100%;

    margin-top: 42px;

    display: flex;

    justify-content: flex-end;

    align-items: center;

    gap: 28px;
}


/* =====================================================
   CREAR
===================================================== */

.crear {
    color: #a8c7fa;

    text-decoration: none;

    font-size: 14px;

    font-weight: 600;
}

.crear:hover {
    text-decoration: underline;
}


/* =====================================================
   BOTON
===================================================== */

button {
    min-width: 108px;

    height: 40px;

    padding: 0 24px;

    border: none;

    border-radius: 22px;

    background: #a8c7fa;

    color: #202124;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;
}

button:hover {
    background: #c1d6fa;
}

button:active {
    transform: scale(.98);
}


/* =====================================================
   DEMO
===================================================== */

.demo {
    text-align: center;

    margin-top: 6px;

    color: #777b80;

    font-size: 9px;

    letter-spacing: 1px;

    user-select: none;
}


/* =====================================================
   PIE
===================================================== */

.pie {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 20px 16px 0;

    color: #bdc1c6;

    font-size: 12px;
}

.pie-derecha {
    display: flex;

    gap: 28px;
}

.pie a {
    color: #bdc1c6;

    text-decoration: none;
}

.pie a:hover {
    text-decoration: underline;
}


/* =====================================================
   MENSAJE
===================================================== */

.mensaje {
    position: fixed;

    left: 50%;

    bottom: 30px;

    transform: translateX(-50%);

    padding: 10px 15px;

    border-radius: 6px;

    background: #303134;

    color: #e8eaed;

    font-size: 13px;

    opacity: 0;

    pointer-events: none;

    transition: opacity .2s;
}

.mensaje.visible {
    opacity: 1;
}


/* =====================================================
   CELULAR
===================================================== */

@media (max-width: 700px) {

    body {
        padding: 15px;
    }

    .tarjeta {
        height: auto;

        min-height: 500px;

        display: block;

        padding: 32px 25px;

        border-radius: 22px;
    }

    .izquierda {
        margin-bottom: 45px;
    }

    .logo {
        margin-bottom: 25px;
    }

    h1 {
        font-size: 30px;
    }

    .descripcion {
        margin-top: 14px;
    }

    .derecha {
        padding-top: 0;
    }

    .informacion {
        margin-top: 35px;
    }

    .acciones {
        margin-top: 35px;

        justify-content: space-between;
    }

    .pie {
        padding-left: 8px;

        padding-right: 8px;

        flex-direction: column;

        align-items: flex-start;

        gap: 18px;
    }

    .pie-derecha {
        gap: 20px;
    }
}


/* =====================================================
   CELULAR PEQUEÑO
===================================================== */

@media (max-width: 400px) {

    h1 {
        font-size: 27px;
    }

    .tarjeta {
        padding: 28px 20px;
    }

    .acciones {
        gap: 15px;
    }
}

</style>
</head>


<body>


<div class="pagina">


    <!-- =================================================
         TARJETA
    ================================================== -->

    <div class="tarjeta">


        <!-- =================================================
             IZQUIERDA
        ================================================== -->

        <div class="izquierda">


            <!-- TU PNG -->

            <img
                src="google.png"
                class="logo"
                alt="Demo"
            >


            <h1>
                Accede a tu cuenta
            </h1>


            <div class="descripcion">
                Usa tu cuenta para continuar
            </div>


        </div>


        <!-- =================================================
             DERECHA
        ================================================== -->

        <div class="derecha">


            <div class="campo">

                <input
                    type="text"
                    id="correo"
                    placeholder=" "
                    autocomplete="off"
                >

                <label for="correo">
                    Correo electrónico o teléfono
                </label>

            </div>


            <a
                href="#"
                class="enlace"
                onclick="mostrarMensaje(event)"
            >
                ¿Olvidaste el correo electrónico?
            </a>


            <div class="informacion">

                ¿Esta no es tu computadora?
                Usa el modo de invitado para
                navegar de forma privada.

                <a
                    href="#"
                    onclick="mostrarMensaje(event)"
                >
                    Más información para usar el modo de invitado
                </a>

            </div>


            <div class="acciones">

                <a
                    href="#"
                    class="crear"
                    onclick="mostrarMensaje(event)"
                >
                    Crear cuenta
                </a>


                <button
                    type="button"
                    onclick="continuar()"
                >
                    Siguiente
                </button>

            </div>


        </div>

    </div>


    <!-- =================================================
         DEMO PEQUEÑO
    ================================================== -->

    <div class="demo">
        DEMO
    </div>


    <!-- =================================================
         PIE
    ================================================== -->

    <div class="pie">


        <div>
            Español (Latinoamérica)
        </div>


        <div class="pie-derecha">

            <a href="#">
                Ayuda
            </a>

            <a href="#">
                Privacidad
            </a>

            <a href="#">
                Condiciones
            </a>

        </div>


    </div>

</div>


<div
    id="mensaje"
    class="mensaje"
>
</div>


<script>

/* =====================================================
   CONTINUAR
===================================================== */

function continuar() {

    const correo =
        document
        .getElementById("correo")
        .value
        .trim();

    const mensaje =
        document
        .getElementById("mensaje");


    if (correo === "") {

        mensaje.textContent =
            "Introduce un correo para continuar.";

    } else {

        mensaje.textContent =
            "Esta es una demostración. No se envían datos.";

    }


    mensaje.classList.add("visible");


    setTimeout(
        function() {

            mensaje.classList.remove("visible");

        },
        2500
    );
}


/* =====================================================
   MENSAJES
===================================================== */

function mostrarMensaje(event) {

    event.preventDefault();


    const mensaje =
        document
        .getElementById("mensaje");


    mensaje.textContent =
        "Esta opción pertenece únicamente a la demostración.";


    mensaje.classList.add("visible");


    setTimeout(
        function() {

            mensaje.classList.remove("visible");

        },
        2500
    );
}

</script>

</body>
</html>
